<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Review Moderation | Jerome Balangue</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #eef4ff;
      background:
        linear-gradient(90deg, rgba(1, 5, 12, 0.72), rgba(15, 68, 166, 0.36)),
        #02050c url("static/media/images/site/portfolio-background.png") center / cover no-repeat;
    }

    main {
      width: min(100%, 560px);
      padding: 42px 36px;
      border: 1px solid #31568e;
      border-radius: 22px;
      background: rgba(5, 18, 43, 0.96);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
      text-align: center;
    }

    .spinner {
      width: 52px;
      height: 52px;
      margin: 0 auto;
      border: 3px solid rgba(145, 184, 251, 0.24);
      border-top-color: #91b8fb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .eyebrow {
      margin-top: 22px;
      color: #91b8fb;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2.5px;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0 10px;
      font-size: clamp(1.75rem, 7vw, 2.125rem);
      line-height: 1.12;
    }

    p {
      margin: 0;
      color: #bdcdea;
      font-size: 14px;
      line-height: 1.7;
    }

    a {
      display: none;
      margin-top: 28px;
      padding: 14px 24px;
      border-radius: 999px;
      color: #fff;
      background: #155fd7;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.8px;
      text-decoration: none;
      text-transform: uppercase;
    }

    main[data-state="error"] .spinner {
      border-color: #ff8197;
      animation: none;
    }

    main[data-state="complete"] .spinner {
      display: grid;
      place-items: center;
      border-color: #57d6a3;
      color: #57d6a3;
      animation: none;
    }

    main[data-state="complete"] .spinner::after {
      content: "\2713";
      font-size: 26px;
      font-weight: 800;
    }

    main[data-state="error"] a,
    main[data-state="complete"] a {
      display: inline-block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; }
    }
  </style>
</head>
<body>
  <main data-state="loading">
    <div class="spinner" aria-hidden="true"></div>
    <div class="eyebrow">Review moderation</div>
    <h1>Opening your secure review action...</h1>
    <p data-message>Please wait while we connect to the review service.</p>
    <a href="./#reviews">Return to reviews</a>
  </main>

  <script>
    (async () => {
      "use strict";

      const webAppUrl = "https://script.google.com/macros/s/AKfycbxwS5NBw7Lqgjas7Kh7P2QtIq_b2PMLZejBw3RN6jmFLuJ493m_xT1vEsq8akp2TU0F-A/exec";
      const page = document.querySelector("main");
      const heading = document.querySelector("h1");
      const message = document.querySelector("[data-message]");
      const parameters = new URLSearchParams(window.location.hash.slice(1));
      const action = parameters.get("reviewAction") || "";
      const reviewId = parameters.get("reviewId") || "";
      const reviewToken = parameters.get("reviewToken") || "";
      const validAction = action === "approve" || action === "reject";

      if (!validAction || !/^[a-f0-9]{32}$/i.test(reviewId) || !/^[a-f0-9]{64}$/i.test(reviewToken)) {
        page.dataset.state = "error";
        heading.textContent = "Invalid moderation link";
        message.textContent = "This link is incomplete or invalid. Please use the newest moderation email.";
        return;
      }

      const destination = new URL(webAppUrl);
      destination.searchParams.set("reviewAction", action);
      destination.searchParams.set("reviewId", reviewId);
      destination.searchParams.set("reviewToken", reviewToken);
      heading.textContent = action === "approve" ? "Accepting and posting review..." : "Declining and deleting review...";
      window.history.replaceState(null, "", window.location.pathname + window.location.search);

      try {
        await fetch(destination.toString(), {
          method: "GET",
          mode: "no-cors",
          credentials: "omit",
          cache: "no-store",
          redirect: "follow",
          referrerPolicy: "no-referrer"
        });
        page.dataset.state = "complete";
        heading.textContent = action === "approve" ? "Review accepted and posted" : "Review declined and deleted";
        message.textContent = action === "approve"
          ? "The review action was sent securely. Open the reviews page to see the published review."
          : "The review action was sent securely and the pending review was removed.";
      } catch (error) {
        page.dataset.state = "error";
        heading.textContent = "Could not reach the review service";
        message.textContent = "Please retry from the newest email. If Google still blocks the request, open it in an incognito window.";
      }
    })();
  </script>
</body>
</html>
