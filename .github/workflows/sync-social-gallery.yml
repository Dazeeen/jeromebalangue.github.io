name: Sync portfolio galleries

on:
  push:
    branches:
      - main
    paths:
      - "static/media/images/social-media-designs/**"
      - "!static/media/images/social-media-designs/gallery.json"
      - "!static/media/images/social-media-designs/gallery-data.js"
      - "scripts/generate-social-gallery.mjs"
      - "static/media/images/AI_generated_design/**"
      - "!static/media/images/AI_generated_design/gallery.json"
      - "!static/media/images/AI_generated_design/gallery-data.js"
      - "scripts/generate-ai-gallery.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the portfolio
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate gallery manifests
        run: |
          node scripts/generate-social-gallery.mjs
          node scripts/generate-ai-gallery.mjs

      - name: Commit updated manifest
        shell: bash
        run: |
          if git diff --quiet -- \
            static/media/images/social-media-designs/gallery.json \
            static/media/images/social-media-designs/gallery-data.js \
            static/media/images/AI_generated_design/gallery.json \
            static/media/images/AI_generated_design/gallery-data.js; then
            echo "Gallery data is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            static/media/images/social-media-designs/gallery.json \
            static/media/images/social-media-designs/gallery-data.js \
            static/media/images/AI_generated_design/gallery.json \
            static/media/images/AI_generated_design/gallery-data.js
          git commit -m "chore: sync portfolio gallery data"
          git push
